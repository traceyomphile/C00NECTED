<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C00NECTED</title>

    <link rel="stylesheet" href="../css/welcome.css">
</head>
<body>
    <div class="app">
        <!-- Welcome screen -->
        <section class="panel welcome-panel">
            <main class="hero">
                <h1 class="logo" aria-label="C00NECTED">
                    <span>C</span><span class="zero">00</span><span>NECTED</span>
                </h1>

                <div class="divider"></div>

                <p class="tagline">
                    connect <span class="sep">•</span> chat <span class="sep">•</span> call
                </p>

                <div class="dots" aria-label="loading animation">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </main>
        </section>

        <!-- Login screen -->
        <section class="panel login-panel">
            <main class="login-wrapper">
                <h1 class="login-title">LOGIN</h1>

                <form class="login-form">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="username" required>

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="*********" required>

                        <button type="submit">LOGIN</button>
                        <button type="submit">SIGNUP</button>
                    </div>
                </form>
            </main>
        </section>
    </div>

    <script>
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.body.classList.add("show-login");
            }, 4000);
        });
    </script>
</body>
</html>
